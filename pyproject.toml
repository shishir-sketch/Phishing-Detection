[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-detector"
version = "0.1.0"
description = "ML-based phishing website detection: URL feature engineering and model comparison on precision, recall, F1 and false-positive rate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "joblib>=1.2",
]

[project.optional-dependencies]
xgboost = ["xgboost>=1.7"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
phish-train = "phishing_detector.train:main"
phish-predict = "phishing_detector.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
